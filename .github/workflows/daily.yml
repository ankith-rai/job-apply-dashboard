name: Daily job search

# 07:30 IST = 02:00 UTC. GitHub cron is always UTC.
on:
  schedule:
    - cron: "0 2 * * 1-5"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    # GITHUB_TOKEN is read-only by default on schedule-triggered runs. These
    # scopes let the job push a bot branch and open/merge a PR into main.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # Runs the pipeline in-process and commits the updated store back to the
      # repo, so the dashboard shows fresh data without a hosted database.
      # No tsx: Node strips the types in scripts/run-inline.mts natively.
      - name: Run pipeline
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: npm run run:inline

      # -f is required: .gitignore excludes /data/*.json so local runs don't
      # dirty the working tree. This is the one place the store is meant to be
      # committed, so it opts out deliberately. Without -f, git add exits
      # non-zero on an ignored path and the whole job fails.
      #
      # main is protected (PRs required), so we push to a bot branch and open/merge
      # a PR instead of pushing directly. Rebase onto main first because stage
      # changes from the dashboard may land between checkout and push.
      - name: Commit results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "apply-pilot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/jobs.json
          if git diff --staged --quiet; then
            echo "store unchanged — nothing to commit"
            exit 0
          fi
          RUN_DATE="$(date -u +%F)"
          BRANCH="bot/daily-jobs-${RUN_DATE}"
          git commit -m "chore: daily run ${RUN_DATE}"
          git pull --rebase -X theirs origin main
          git push origin "HEAD:${BRANCH}"
          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "chore: daily run ${RUN_DATE}" \
            --body "Automated update to \`data/jobs.json\` from the daily workflow."
          gh pr merge "${BRANCH}" --merge --delete-branch || {
            echo "::warning::PR created but could not auto-merge (review or checks may be required)."
          }
