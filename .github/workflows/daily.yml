name: Daily job search

# 07:30 IST = 02:00 UTC. GitHub cron is always UTC.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    # GITHUB_TOKEN is read-only by default on schedule-triggered runs, which is
    # why `git push` returned 403. This grants the one scope the job needs.
    # Anything more is unnecessary — it only ever writes data/jobs.json.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # Runs the pipeline in-process and commits the updated store back to the
      # repo, so the dashboard shows fresh data without a hosted database.
      # No tsx: Node strips the types in scripts/run-inline.mts natively.
      - name: Run pipeline
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: npm run run:inline

      # -f is required: .gitignore excludes /data/*.json so local runs don't
      # dirty the working tree. This is the one place the store is meant to be
      # committed, so it opts out deliberately. Without -f, git add exits
      # non-zero on an ignored path and the whole job fails.
      #
      # The rebase before pushing matters because you also change stages from the
      # dashboard. Without it, any commit landing between checkout and push makes
      # this one non-fast-forward and the run fails on a conflict it could have
      # absorbed — the store is the only file in play, and this run's copy is the
      # newer one.
      - name: Commit results
        run: |
          git config user.name "apply-pilot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/jobs.json
          if git diff --staged --quiet; then
            echo "store unchanged — nothing to commit"
            exit 0
          fi
          git commit -m "chore: daily run $(date -u +%F)"
          git pull --rebase --strategy-option=ours origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"